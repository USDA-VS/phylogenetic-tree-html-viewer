# Checks every change for tree data, then publishes ONLY TreeViewer.html to GitHub Pages.
# The site serves it as its front page, so the viewer opens at the plain page address.
# Setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Check and publish

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Check for data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Only the viewer and its documentation are allowed
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            case "$f" in
              TreeViewer.html|README.md|LICENSE|.gitignore|.github/workflows/*.yml) ;;
              */*) echo "::error file=$f::'$f' is not allowed here. This repository holds only the blank viewer and its documentation. Remove this file and check whether it contains sample data."; fail=1 ;;
              *.png) ;;
              *) echo "::error file=$f::'$f' is not allowed here. This repository holds only the blank viewer and its documentation. Remove this file and check whether it contains sample data."; fail=1 ;;
            esac
          done < <(git ls-files -z)
          exit $fail

      - name: No saved trees inside the viewer
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            if grep -qE 'name="tv-contains-tree-data"|<script id="tvEmbedded"' "$f"; then
              echo "::error file=$f::'$f' has a tree saved inside it (made with 'Save as HTML'). Replace it with the blank viewer."
              fail=1
            fi
          done < <(git ls-files -z -- '*.html' '*.htm')
          exit $fail

      - name: Privacy lock is still in place
        run: |
          grep -q "connect-src 'none'" TreeViewer.html || { echo "::error file=TreeViewer.html::The privacy lock (Content-Security-Policy) was removed from TreeViewer.html."; exit 1; }

  publish:
    name: Publish viewer
    needs: check
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage only the viewer (as the front page and under its own name)
        run: |
          mkdir _site
          cp TreeViewer.html _site/index.html
          cp TreeViewer.html _site/TreeViewer.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
